    <!--
      THESIS: A one-bit desktop terminal where every A*/A workshop is a row in
      a monospace deadline ledger — refusing the category's colored card grid
      and its soft countdown chips.
      OWN-WORLD: pure black on pure white, hard 1px borders, zero radius, IBM
      Plex Mono throughout; inverse video marks CLOSING rows, dim gray marks
      TBA; status by text and inversion, never color; ASCII block bars in the
      stats window.
      STORY: the visitor types a topic at the prompt, the ledger re-sorts by
      submission deadline, each row carries its rank, venue, and source link
      out to the call for papers before the window closes.
      FIRST VIEWPORT: a black title bar reading WORKSHOP FINDER above a
      terminal-prompt search field; a left filter panel of checkbox legends;
      the first deadline rows visible without scrolling, closing rows in
      inverse video.
      FORM: one-bit desktop terminal; challenger (not the roll); seed key 599dccd0.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
