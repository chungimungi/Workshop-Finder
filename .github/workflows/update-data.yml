name: Refill the catalog

# Keeps the workshop dataset fresh: re-runs the scraping pipeline on a
# schedule and commits the rebuilt dataset. Also runnable by hand.

on:
  schedule:
    - cron: "17 5 * * *" # daily at 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run the pipeline
        run: bash pipeline/update.sh

      - name: Commit refreshed dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): refill the workshop catalog"
          file_pattern: "data/*.json web/public/data/*.json"
